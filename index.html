<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磨削接刀标定｜神经网络(WebWorker后台) 预测+概率区间</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:1100px;margin:16px auto;padding:12px;background:#f4f6f8}
.box{background:#fff;padding:16px;border-radius:8px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
h3{margin-top:0;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
input{padding:6px 8px;width:160px;border:1px solid #bbb;border-radius:4px;font-size:14px}
button{padding:6px 12px;border:none;border-radius:4px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}
button.del{background:#dc2626}
button.prob{background:#028448}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#efefef}
.warn{color:#c00;font-weight:bold}
.info{color:#066;font-weight:bold}
.prob-text{color:#028448;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h3>📊 测点录入</h3>
<div class="row">
    <input id="inX" placeholder="补偿X(mm)">
    <input id="inY" placeholder="实测误差Y(mm)">
    <button onclick="addPoint()">添加测点</button>
    <button class="del" onclick="clearAllPoints()">清空测点</button>
    <button onclick="exportCSV()">导出CSV</button>
</div>
<table>
<thead><tr><th>序号</th><th>X (mm)</th><th>Y (mm)</th><th>删除</th></tr></thead>
<tbody id="dataTable"></tbody>
</table>
</div>

<div class="box">
<h3>🔢 神经网络训练 & 单点预测（Y+概率区间）</h3>
<div class="row">
    <button onclick="startTrain()">开始训练神经网络</button>
</div>
<div class="row">
    <input id="evalX" placeholder="输入X预测Y">
    <button onclick="calcGivenX()">计算预测</button>
</div>
<div id="evalResult"></div>
<div class="row" style="margin-top:8px">
    <button onclick="solveY0()">求解 Y=0 的零点X</button>
</div>
<div id="zeroResult"></div>
</div>

<div class="box">
<h3>📉 公差概率计算</h3>
<div class="row">
    <input id="tolX" placeholder="目标X">
    <input id="targetY" placeholder="目标Y" value="0">
    <input id="tolerance" placeholder="±公差mm" value="0.003">
    <button class="prob" onclick="calcTolProb()">计算公差合格概率</button>
</div>
<div id="probResult"></div>
</div>

<div class="box">
<h3>📋 批量参考表</h3>
<div class="row">
    <input id="refXStart" placeholder="X起始" value="-0.19">
    <input id="refXEnd" placeholder="X结束" value="-0.18">
    <input id="refStep" placeholder="步长mm" value="0.0001">
    <button onclick="buildRefTable()">生成参考表</button>
</div>
<div id="refTable"></div>
</div>

<div class="box">
<h3>ℹ️ 训练信息</h3>
<div id="fitInfo"></div>
</div>

<script>
const STORAGE_KEY = "grind_nn_worker_points";
let pointList = [];
let modelWeights = null;
let normPara = null;
let worker = null;

//正态分布CDF，概率计算
function normCdf(z) {
    if (z < -8) return 0;
    if (z > 8) return 1;
    const a1 = 0.319381530;
    const a2 = -0.356563782;
    const a3 = 1.781477937;
    const a4 = -1.821255978;
    const a5 = 1.330274429;
    const p = 0.2316419;
    const c = 0.39894228;
    let t = 1 / (1 + p * Math.abs(z));
    let poly = t*(a1 + t*(a2 + t*(a3 + t*(a4 + t*a5))));
    let nd = 1 - c * Math.exp(-0.5*z*z) * poly;
    return z >= 0 ? nd : 1 - nd;
}

// 内嵌Worker代码字符串
const workerCode = `
function tanh(v){return Math.tanh(v)}
function trainNet(points){
    //轻量化网络 1-12-6-1
    const h1=12, h2=6;
    let w1 = Array.from({length:1}, ()=>Array(h1).fill(0).map(()=>(Math.random()-0.5)*0.8));
    let b1 = Array(h1).fill(0).map(()=>(Math.random()-0.5)*0.2);
    let w2 = Array.from({length:h1}, ()=>Array(h2).fill(0).map(()=>(Math.random()-0.5)*0.8));
    let b2 = Array(h2).fill(0).map(()=>(Math.random()-0.5)*0.2);
    let w3 = Array.from({length:h2}, ()=>Array(1).fill(0).map(()=>(Math.random()-0.5)*0.8));
    let b3 = [0];

    //归一化参数
    const xs = points.map(p=>p.x);
    const ys = points.map(p=>p.y);
    const xMin = Math.min(...xs);
    const xMax = Math.max(...xs);
    const yMin = Math.min(...ys);
    const yMax = Math.max(...ys);
    function normX(xRaw){ return 2*(xRaw - xMin)/(xMax - xMin) -1; }
    function denormY(yNorm){ return (yNorm+1)/2*(yMax-yMin)+yMin; }

    const epochs = 2200;
    const lr = 0.018;
    const L2 = 0.0001;
    const n = points.length;

    for(let e=0;e<epochs;e++){
        for(let p of points){
            const xn = normX(p.x);
            //前向
            let l1 = [];
            for(let j=0;j<h1;j++){
                const s = b1[j] + xn * w1[0][j];
                l1.push(tanh(s));
            }
            let l2 = [];
            for(let j=0;j<h2;j++){
                let s = b2[j];
                for(let i=0;i<h1;i++) s += l1[i] * w2[i][j];
                l2.push(tanh(s));
            }
            let yN = b3[0];
            for(let i=0;i<h2;i++) yN += l2[i] * w3[i][0];
            const yPred = denormY(yN);
            const err = yPred - p.y;

            //反向传播
            const gradW3 = l2.map(v=> err*v + L2 * w3[v][0]);
            const gradB3 = err;

            const gradL2 = Array(h2).fill(0);
            for(let i=0;i<h2;i++) gradL2[i] = err * w3[i][0] * (1-l2[i]*l2[i]);

            const gradW2 = [];
            for(let i=0;i<h1;i++){
                const row = [];
                for(let j=0;j<h2;j++) row.push( gradL2[j]*l1[i] + L2*w2[i][j] );
                gradW2.push(row);
            }
            const gradB2 = gradL2;

            const gradL1 = Array(h1).fill(0);
            for(let i=0;i<h1;i++){
                let sum=0;
                for(let j=0;j<h2;j++) sum += gradL2[j] * w2[i][j];
                gradL1[i] = sum * (1-l1[i]*l1[i]);
            }
            const gradW1 = Array(1).fill(0).map(()=>gradL1.map((g)=> g*xn + L2*w1[0][g]));
            const gradB1 = gradL1;

            //更新权重
            for(let j=0;j<h1;j++) w1[0][j] -= lr * gradW1[0][j];
            for(let j=0;j<h1;j++) b1[j] -= lr * gradB1[j];
            for(let i=0;i<h1;i++){
                for(let j=0;j<h2;j++) w2[i][j] -= lr*gradW2[i][j];
            }
            for(let j=0;j<h2;j++) b2[j] -= lr * gradB2[j];
            for(let i=0;i<h2;i++) w3[i][0] -= lr*gradW3[i];
            b3[0] -= lr * gradB3;
        }
    }
    //计算残差标准差
    let sumErrSq=0;
    for(let p of points){
        const xn = normX(p.x);
        let l1=[];
        for(let j=0;j<h1;j++) l1.push(tanh(b1[j] + xn*w1[0][j]));
        let l2=[];
        for(let j=0;j<h2;j++){let s=b2[j];for(let i=0;i<h1;i++)s+=l1[i]*w2[i][j];l2.push(tanh(s));}
        let yn = b3[0]; for(let i=0;i<h2;i++) yn += l2[i]*w3[i][0];
        const yp = denormY(yn);
        sumErrSq += (yp-p.y)*(yp-p.y);
    }
    const sigma = Math.sqrt(sumErrSq / (points.length-1));
    return {w1,b1,w2,b2,w3,b3,norm:{xMin,xMax,yMin,yMax},sigma};
}
self.onmessage = (msg)=>{
    const res = trainNet(msg.data);
    self.postMessage(res);
}`;

//创建Worker
function createWorker(){
    const blob = new Blob([workerCode],{type:"application/javascript"});
    const url = URL.createObjectURL(blob);
    worker = new Worker(url);
    worker.onmessage = (e)=>{
        modelWeights = e.data;
        normPara = e.data.norm;
        document.getElementById("fitInfo").innerHTML = `<div class="info">✅神经网络训练完成<br>残差标准差σ=${modelWeights.sigma.toFixed(6)}</div>`;
    }
    worker.onerror = (err)=>{
        document.getElementById("fitInfo").innerHTML = `<span class="warn">训练出错：${err.message}</span>`;
    }
}

//预测函数
function nnPredict(xRaw){
    if(!modelWeights || !normPara) return null;
    const {w1,b1,w2,b2,w3,b3} = modelWeights;
    const {xMin,xMax,yMin,yMax} = normPara;
    function normX(x){ return 2*(x - xMin)/(xMax - xMin) -1; }
    function denormY(yNorm){ return (yNorm+1)/2*(yMax-yMin)+yMin; }
    const xn = normX(xRaw);
    const h1=w1[0].length;
    const h2=w2[0].length;
    let l1=[];
    for(let j=0;j<h1;j++) l1.push(Math.tanh(b1[j] + xn * w1[0][j]));
    let l2=[];
    for(let j=0;j<h2;j++){
        let s = b2[j];
        for(let i=0;i<h1;i++) s += l1[i] * w2[i][j];
        l2.push(Math.tanh(s));
    }
    let yn = b3[0];
    for(let i=0;i<h2;i++) yn += l2[i] * w3[i][0];
    const yPred = denormY(yn);
    const sigma = modelWeights.sigma;
    return {yPred, sigma};
}

function startTrain(){
    if(pointList.length <3){
        document.getElementById("fitInfo").innerHTML = `<span class="warn">至少3个测点才能训练</span>`;
        return;
    }
    document.getElementById("fitInfo").innerHTML = `<span>后台正在训练神经网络，页面不会卡死，可以继续操作</span>`;
    if(!worker) createWorker();
    worker.postMessage([...pointList]);
}

//测点管理
function loadPoints(){
    const save = localStorage.getItem(STORAGE_KEY);
    if(save) pointList = JSON.parse(save);
    renderTable();
}
function savePoints(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pointList));
}
function addPoint(){
    const xv = parseFloat(document.getElementById("inX").value);
    const yv = parseFloat(document.getElementById("inY").value);
    if(isNaN(xv)||isNaN(yv)){alert("请输入有效的数字");return;}
    pointList.push({x:xv,y:yv});
    savePoints();renderTable();
    document.getElementById("inX").value="";document.getElementById("inY").value="";
}
function delPoint(idx){
    pointList.splice(idx,1);savePoints();renderTable();
}
function clearAllPoints(){
    pointList=[];modelWeights=null;savePoints();renderTable();
    document.getElementById("fitInfo").innerText="";
}
function renderTable(){
    const tb = document.getElementById("dataTable");
    tb.innerHTML="";
    pointList.forEach((p,i)=>{
        const tr = document.createElement("tr");
        tr.innerHTML=`<td>${i+1}</td><td>${p.x.toFixed(6)}</td><td>${p.y.toFixed(6)}</td><td><button class="del" onclick="delPoint(${i})">删除</button></td>`;
        tb.appendChild(tr);
    })
}
function exportCSV(){
    let str = "X(mm),Y(mm)\n";
    pointList.forEach(p=>str += `${p.x},${p.y}\n`);
    const blob = new Blob([str],{type:"text/csv"});
    const a = document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="磨削标定测点.csv";
    a.click();
}

function calcGivenX(){
    const xv = parseFloat(document.getElementById("evalX").value);
    if(isNaN(xv)){
        document.getElementById("evalResult").innerHTML = `<span class="warn">输入有效的X</span>`;
        return;
    }
    const pred = nnPredict(xv);
    if(!pred){
        document.getElementById("evalResult").innerHTML = `<span class="warn">先训练模型</span>`;
        return;
    }
    const y = pred.yPred;
    const sigma = pred.sigma;
    const low95 = y - 1.96*sigma;
    const high95 = y +1.96*sigma;
    let html = `
    <div>输入 X = ${xv.toFixed(6)}</div>
    <div class="info">预测中心值 Y = ${y.toFixed(6)}</div>
    <div>工艺波动标准差 σ = ${sigma.toFixed(6)}</div>
    <div class="prob-text">95%置信区间：[${low95.toFixed(6)} , ${high95.toFixed(6)}]</div>
    `;
    document.getElementById("evalResult").innerHTML = html;
}

function calcTolProb(){
    const xv = parseFloat(document.getElementById("tolX").value);
    const targetY = parseFloat(document.getElementById("targetY").value||0);
    const tol = parseFloat(document.getElementById("tolerance").value);
    const pred = nnPredict(xv);
    if(!pred){
        document.getElementById("probResult").innerHTML = `<span class="warn">先训练模型</span>`;
        return;
    }
    const prob = normCdf(targetY+tol, pred.yPred, pred.sigma) - normCdf(targetY-tol, pred.yPred, pred.sigma);
    const pct = Math.max(0, Math.min(100, prob*100));
    document.getElementById("probResult").innerHTML = `<div class="prob-text">公差合格概率：${pct.toFixed(2)} %</div>`;
}
function normCdf(z, mu, sigma){
    return normCdf( (z-mu)/sigma );
}

//二分求零点Y=0
function solveY0(){
    if(!modelWeights){
        document.getElementById("zeroResult").innerHTML = `<span class="warn">先训练模型</span>`;
        return;
    }
    const xs = pointList.map(p=>p.x);
    const xMin = Math.min(...xs);
    const xMax = Math.max(...xs);
    let xa=xMin, xb=xMax;
    for(let iter=0;iter<80;iter++){
        const xmid = (xa+xb)/2;
        const ym = nnPredict(xmid).yPred;
        const ya = nnPredict(xa).yPred;
        if(ya * ym <=0) xb=xmid; else xa=xmid;
    }
    const rootX = (xa+xb)/2;
    const predRoot = nnPredict(rootX);
    const low95 = predRoot.yPred -1.96*predRoot.sigma;
    const high95 = predRoot.yPred +1.96*predRoot.sigma;
    let html = `<div class="info">✅Y=0零点 X = ${rootX.toFixed(6)}</div>
    <div>95%置信区间 [${low95.toFixed(6)}, ${high95.toFixed(6)}]</div>`;
    document.getElementById("zeroResult").innerHTML = html;
}

function buildRefTable(){
    if(!modelWeights){
        document.getElementById("refTable").innerHTML = `<span class="warn">先训练模型</span>`;
        return;
    }
    const xStart = parseFloat(document.getElementById("refXStart").value);
    const xEnd = parseFloat(document.getElementById("refXEnd").value);
    const step = parseFloat(document.getElementById("refStep").value);
    if(isNaN(xStart)||isNaN(xEnd)||isNaN(step)||step<=0){
        document.getElementById("refTable").innerHTML = `<span class="warn">参数错误</span>`;
        return;
    }
    let html = `<table><tr><th>X</th><th>预测Y</th><th>σ波动</th><th>95%下限</th><th>95%上限</th></tr>`;
    for(let x=xStart;x <= xEnd+step/2;x+=step){
        const p = nnPredict(x);
        const low = p.yPred -1.96*p.sigma;
        const high = p.yPred +1.96*p.sigma;
        html += `<tr>
        <td>${x.toFixed(6)}</td>
        <td>${p.yPred.toFixed(6)}</td>
        <td>${p.sigma.toFixed(6)}</td>
        <td>${low.toFixed(6)}</td>
        <td>${high.toFixed(6)}</td>
        </tr>`;
    }
    html += `</table>`;
    document.getElementById("refTable").innerHTML = html;
}

window.onload = loadPoints;
</script>
</body>
</html>
