<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磨削接刀标定计算器‑多设备版【多项式+动态阶数拉格朗日插值】</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif}
body{max-width:1200px;margin:16px auto;padding:12px;background:#f4f6f8}
.box{background:#fff;padding:16px;border-radius:8px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
h3{margin-top:0;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
input,select{padding:6px;border:1px solid #ccc;border-radius:4px;font-size:14px}
button{padding:7px 14px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer}
button:hover{background:#1d4ed8}
canvas{width:100% !important;height:320px !important;margin:8px 0}
table{border-collapse: collapse;width:100%;font-size:12px;margin:8px 0}
th,td{border:1px solid #ccc;padding:5px;text-align:center}
th{background:#edf2f7}
.table-input td input{width:100%;border:none;background:transparent;text-align:center}

/* 多设备标签样式 */
.tabRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabBtn{padding:6px 12px;background:#cbd5e1;border-radius:6px;border:none}
.tabBtn.active{background:#2563eb;color:#fff}
</style>
</head>
<body>
<div class="box">
  <h3>设备管理</h3>
  <div class="tabRow" id="tabContainer">
    <!--设备标签动态生成-->
  </div>
  <div class="row">
    <button onclick="addDevice()">新增设备</button>
    <button onclick="delCurrentDevice()">删除当前设备</button>
  </div>
</div>

<div class="box">
  <h3>1、标定数据【表格输入】X / Y实测(mm)</h3>
  <table class="table-input" id="inputTable">
    <thead>
      <tr>
        <th>X</th>
        <th>Y实测</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <!--数据行动态生成-->
    </tbody>
  </table>
  <div class="row">
    <button onclick="addRow()">增加一行</button>
    <button onclick="delRow(this)">删除</button>
    <button onclick="clearTable()">清空表格</button>
  </div>
  <div class="row" style="margin-top:10px;">
    <div>计算模式：
      <select id="calcMode">
        <option value="sliding">✅滑动窗口局部线性拟合【推荐 磨削标定】</option>
        <option value="poly">多项式拟合（旧全局模式，对比用）</option>
      </select>
    </div>
    <div>滑动窗口点数：
      <select id="winSize">
        <option value="3">3点</option>
        <option value="5" selected>5点（推荐）</option>
        <option value="7">7点</option>
      </select>
    </div>
    <div>多项式阶数 <input id="polyOrder" type="number" value="4" min="1" max="12" style="width:50px"></div>
    <div>插值起始X<input id="xStart" type="number" value="-0.72" step="0.000001" style="width:80px"></div>
    <div>插值终止X<input id="xEnd" type="number" value="0" step="0.000001" style="width:80px"></div>
    <div>插值点数<input id="interpCount" type="number" value="100" min="20" max="500" style="width:60px"></div>
    <button onclick="runCalc()">开始计算</button>
  </div>
</div>

<div class="box">
  <h3>2、主曲线：补偿趋势 + 波动区间（红线 ±0.002 工艺公差）</h3>
  <canvas id="chartMain"></canvas>
</div>

<div class="box">
  <h3>3、残差散点图（观察有无周期性/残留趋势，接刀缺陷诊断）</h3>
  <canvas id="chartResidual"></canvas>
</div>

<div class="box">
  <h3>4、标定测点残差结果</h3>
  <div id="residualOut"></div>
</div>

<div class="box">
  <h3>5、连续插值预测补偿点（可直接复制导入机床补偿表）</h3>
  <button onclick="copyPredictTable()">复制全部预测点文本</button>
  <div id="predictOut"></div>
</div>

<script>
//全局变量
let currentDeviceId = null;
let deviceList = [];
let chartMain, chartRes;
const STORAGE_KEY = "grindCalDeviceData";
// =========【这里写入你截图里的默认初始标定数据】=========
const DEFAULT_INIT_ROWS = [
  {x:"0",      y:"-0.0077"},
  {x:"-0.72",  y:"0.0078"},
  {x:"-0.36",  y:"0.0050"},
  {x:"-0.18",  y:"-0.0020"},
  {x:"-0.207", y:"0.0040"},
  {x:"-0.187", y:"-0.0033"},
  {x:"-0.1885",y:"-0.0003"},
  {x:"-0.1884",y:"-0.0057"},
];

//=========存储读写 多设备本地持久化=========
function loadAllDeviceData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw) deviceList = JSON.parse(raw);
  if(deviceList.length ===0){
    //默认创建第一个设备，自动填入截图里这8组数据
    deviceList.push({
      id:"dev1",
      name:"设备1",
      tableRows: [...DEFAULT_INIT_ROWS],
      setting:{calcMode:"sliding",winSize:"5",polyOrder:"4",interpCount:"100",xStart:-0.72,xEnd:0}
    });
  }
}
function saveAllDeviceData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(deviceList));
}
function getCurDevice(){
  return deviceList.find(d=>d.id === currentDeviceId);
}

//========设备标签管理========
function renderTabs(){
  const container = document.getElementById("tabContainer");
  container.innerHTML = "";
  deviceList.forEach(dev=>{
    const btn = document.createElement("button");
    btn.className = "tabBtn" + (dev.id === currentDeviceId ? " active":"");
    btn.innerText = dev.name;
    btn.onclick = ()=>switchDevice(dev.id);
    container.appendChild(btn);
  })
}
function switchDevice(devId){
  saveCurrentDeviceForm(); //切换前保存当前设备所有输入
  currentDeviceId = devId;
  loadDeviceToForm();
  renderTabs();
  runCalc();
}
function addDevice(){
  const newId = "dev"+Date.now();
  const newDev = {
    id:newId,
    name:"设备"+(deviceList.length+1),
    tableRows:[...DEFAULT_INIT_ROWS], //新增设备也默认加载这套标定数据
    setting:{calcMode:"sliding",winSize:"5",polyOrder:"4",interpCount:"100",xStart:-0.72,xEnd:0}
  };
  deviceList.push(newDev);
  saveAllDeviceData();
  switchDevice(newId);
}
function delCurrentDevice(){
  if(deviceList.length <=1){
    alert("至少保留1台设备");return;
  }
  const idx = deviceList.findIndex(d=>d.id===currentDeviceId);
  deviceList.splice(idx,1);
  saveAllDeviceData();
  switchDevice(deviceList[0].id);
}

//========表格输入行管理，输入自动记忆========
function renderTable(){
  const dev = getCurDevice();
  const tbody = document.querySelector("#inputTable tbody");
  tbody.innerHTML = "";
  dev.tableRows.forEach((rowData,idx)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><input class="cellX" type="number" step="0.000001" value="${rowData.x||''}"></td>
    <td><input class="cellY" type="number" step="0.000001" value="${rowData.y||''}"></td>
    <td><button onclick="delRow(this)">删除</button></td>`;
    tbody.appendChild(tr);
  })
  //监听输入变化，实时自动保存
  document.querySelectorAll(".cellX,.cellY").forEach(input=>{
    input.oninput = ()=>{saveCurrentDeviceForm();}
  })
}
function addRow(){
  const dev = getCurDevice();
  dev.tableRows.push({x:"",y:""});
  saveAllDeviceData();
  renderTable();
}
function delRow(btn){
  const tr = btn.closest("tr");
  const allTr = Array.from(tr.parentElement.children);
  const idx = allTr.indexOf(tr);
  const dev = getCurDevice();
  if(dev.tableRows.length <=1){alert("至少保留一行");return;}
  dev.tableRows.splice(idx,1);
  saveAllDeviceData();
  renderTable();
  runCalc();
}
function clearTable(){
  const dev = getCurDevice();
  dev.tableRows = [{x:"",y:""}];
  saveAllDeviceData();
  renderTable();
}
//把当前页面全部表单存入当前设备对象
function saveCurrentDeviceForm(){
  const dev = getCurDevice();
  //读取表格
  const rows = [];
  document.querySelectorAll("#inputTable tbody tr").forEach(tr=>{
    const x = tr.querySelector(".cellX").value;
    const y = tr.querySelector(".cellY").value;
    rows.push({x,y});
  })
  dev.tableRows = rows;
  //读取下拉框、输入框参数
  dev.setting.calcMode = document.getElementById("calcMode").value;
  dev.setting.winSize = document.getElementById("winSize").value;
  dev.setting.polyOrder = document.getElementById("polyOrder").value;
  dev.setting.interpCount = document.getElementById("interpCount").value;
  dev.setting.xStart = parseFloat(document.getElementById("xStart").value);
  dev.setting.xEnd = parseFloat(document.getElementById("xEnd").value);
  saveAllDeviceData();
}
//把设备数据加载到页面表单
function loadDeviceToForm(){
  const dev = getCurDevice();
  renderTable();
  document.getElementById("calcMode").value = dev.setting.calcMode;
  document.getElementById("winSize").value = dev.setting.winSize;
  document.getElementById("polyOrder").value = dev.setting.polyOrder;
  document.getElementById("interpCount").value = dev.setting.interpCount;
  document.getElementById("xStart").value = dev.setting.xStart;
  document.getElementById("xEnd").value = dev.setting.xEnd;
}
//读取表格数据为计算点
function readTablePoints(){
  const rows = [];
  document.querySelectorAll("#inputTable tbody tr").forEach(tr=>{
    const xVal = tr.querySelector(".cellX").value;
    const yVal = tr.querySelector(".cellY").value;
    const x = parseFloat(xVal);
    const y = parseFloat(yVal);
    if(!isNaN(x) && !isNaN(y)) rows.push({x,y});
  })
  return rows;
}

// ========== 数学工具函数 ==========
// 最小二乘 一元线性拟合 y = k*x + b
function linearFit(points){
  const n = points.length;
  let sumX=0,sumY=0,sumXX=0,sumXY=0;
  for(let p of points){
    sumX += p.x;
    sumY += p.y;
    sumXX += p.x*p.x;
    sumXY += p.x*p.y;
  }
  const det = n*sumXX - sumX*sumX;
  if(Math.abs(det) < 1e-15){
    return {k:0, b: sumY/n};
  }
  const k = (n*sumXY - sumX*sumY)/det;
  const b = (sumY*sumXX - sumX*sumXY)/det;
  return {k,b};
}

// 多项式拟合
function polyFit(points, order){
  const n = points.length;
  const m = order+1;
  let matA = Array(m).fill(0).map(()=>Array(m).fill(0));
  let vecB = Array(m).fill(0);
  for(let p of points){
    let xpow = Array(m).fill(1);
    for(let i=1;i<m;i++) xpow[i] = xpow[i-1]*p.x;
    for(let i=0;i<m;i++){
      vecB[i] += p.y * xpow[i];
      for(let j=0;j<m;j++) matA[i][j] += xpow[i]*xpow[j];
    }
  }
  //高斯消元
  for(let col=0;col<m;col++){
    let pivot = col;
    for(let r=col;r<m;r++) if(Math.abs(matA[r][col])>Math.abs(matA[pivot][col])) pivot=r;
    [matA[col],matA[pivot]] = [matA[pivot],matA[col]];
    [vecB[col],vecB[pivot]] = [vecB[pivot],vecB[col]];
    const div = matA[col][col];
    if(Math.abs(div)<1e-12) continue;
    for(let j=col;j<m;j++) matA[col][j]/=div;
    vecB[col]/=div;
    for(let r=0;r<m;r++){
      if(r!==col && matA[r][col]!==0){
        const factor = matA[r][col];
        for(let j=col;j<m;j++) matA[r][j] -= factor*matA[col][j];
        vecB[r] -= factor*vecB[col];
      }
    }
  }
  return vecB;
}
function polyEval(coeff, x){
  let y=0;
  let xi=1;
  for(let c of coeff){
    y += c*xi;
    xi *=x;
  }
  return y;
}

//滑动窗口【对单个x求值，用于插值预测点】
function slidingEval(xTarget, rawPoints, winN){
  const half = Math.floor(winN/2);
  let idx=0;
  for(let i=0; i<rawPoints.length;i++){
    if(rawPoints[i].x <= xTarget) idx=i;
  }
  let start = idx-half;
  let end = idx+half;
  if(start<0) start=0;
  if(end >= rawPoints.length) end = rawPoints.length-1;
  const winPts = rawPoints.slice(start, end+1);
  const lb = linearFit(winPts);
  const yTrend = lb.k * xTarget + lb.b;
  let sumE2 =0;
  for(let wp of winPts){
    const yp = lb.k*wp.x + lb.b;
    const e = wp.y - yp;
    sumE2 += e*e;
  }
  const sigmaLocal = Math.sqrt(sumE2 / winPts.length);
  return {
    yTrend:yTrend,
    sigmaLocal:sigmaLocal,
    band1:yTrend+sigmaLocal,
    band1Neg:yTrend-sigmaLocal,
    band196:yTrend+sigmaLocal*1.96,
    band196Neg:yTrend-sigmaLocal*1.96
  }
}

// 原始标定测点计算（用于残差）
function slidingCalcRawPoints(points, winN){
  const out = [];
  const half = Math.floor(winN/2);
  for(let i=0; i<points.length; i++){
    let start = i-half;
    let end = i+half;
    if(start<0) start=0;
    if(end >= points.length) end = points.length-1;
    const winPts = points.slice(start, end+1);
    const lb = linearFit(winPts);
    const yTrend = lb.k * points[i].x + lb.b;
    let sumE2 =0;
    for(let wp of winPts){
      const yp = lb.k*wp.x + lb.b;
      const e = wp.y - yp;
      sumE2 += e*e;
    }
    const sigmaLocal = Math.sqrt(sumE2 / winPts.length);
    const residual = points[i].y - yTrend;
    out.push({
      x: points[i].x,
      yMeas: points[i].y,
      yTrend: yTrend,
      residual: residual,
      sigmaLocal: sigmaLocal,
      band1: yTrend + sigmaLocal,
      band1Neg: yTrend - sigmaLocal,
      band196: yTrend + sigmaLocal*1.96,
      band196Neg: yTrend - sigmaLocal*1.96
    })
  }
  return out;
}

//==== 【改动核心】使用手动输入的xStart、xEnd生成插值点，不再自动取测点极值 ====
function generateInterpolatePoints(rawPoints, count, winN, mode, polyOrder, xStart, xEnd){
  const interpOut = [];
  const step = (xEnd - xStart)/(count-1);
  for(let k=0;k<count;k++){
    const x = xStart + k*step;
    if(mode==="sliding"){
      const res = slidingEval(x, rawPoints, winN);
      interpOut.push({x:x, ...res});
    }else{
      const coeff = polyFit(rawPoints, polyOrder);
      const yt = polyEval(coeff, x);
      let sumE2=0;
      for(let p of rawPoints){
        const ye = polyEval(coeff, p.x);
        sumE2 += Math.pow(p.y - ye, 2);
      }
      const sg = Math.sqrt(sumE2/rawPoints.length);
      interpOut.push({
        x:x,
        yTrend:yt,
        sigmaLocal:sg,
        band1:yt+sg,band1Neg:yt-sg,
        band196:yt+sg*1.96,band196Neg:yt-sg*1.96
      })
    }
  }
  return interpOut;
}

//全局多项式模式
function polyCalc(points, order){
  const coeff = polyFit(points, order);
  const allRes = [];
  let sumE2=0;
  let maxPos=-999, maxNeg=999;
  for(let p of points){
    const yt = polyEval(coeff, p.x);
    const e = p.y - yt;
    allRes.push(e);
    sumE2 += e*e;
    if(e>maxPos) maxPos=e;
    if(e<maxNeg) maxNeg=e;
  }
  const sigmaGlobal = Math.sqrt(sumE2/points.length);
  const out = [];
  for(let p of points){
    const yt = polyEval(coeff, p.x);
    out.push({
      x:p.x,
      yMeas:p.y,
      yTrend:yt,
      residual:p.y-yt,
      sigmaLocal: sigmaGlobal,
      band1: yt+sigmaGlobal,
      band1Neg: yt-sigmaGlobal,
      band196: yt+sigmaGlobal*1.96,
      band196Neg: yt-sigmaGlobal*1.96
    })
  }
  return {res:out, sigmaG:sigmaGlobal, maxPos, maxNeg, allRes};
}

//绘图函数
function drawMain(rawData, interpData){
  const ctx = document.getElementById("chartMain").getContext('2d');
  if(chartMain) chartMain.destroy();
  chartMain = new Chart(ctx,{
    type:"line",
    data:{
      datasets:[
        {label:"实测Y(标定测点)", data:rawData.map(d=>({x:d.x,y:d.yMeas})), borderColor:"#666",pointRadius:4,showLine:false},
        {label:"补偿趋势Ytrend【预测插值】", data:interpData.map(d=>({x:d.x,y:d.yTrend})), borderColor:"#2563eb", borderWidth:2,pointRadius:0},
        {label:"工艺波动上限 ±1σ", data:interpData.map(d=>({x:d.x,y:d.band1})), borderColor:"#10b981", borderWidth:1,pointRadius:0},
        {label:"工艺波动下限 ±1σ", data:interpData.map(d=>({x:d.x,y:d.band1Neg})), borderColor:"#10b981", borderWidth:1,pointRadius:0},
        {label:"局部置信上限 ±1.96σ", data:interpData.map(d=>({x:d.x,y:d.band196})), borderColor:"#f59e0b", borderWidth:1,pointRadius:0},
        {label:"局部置信下限 ±1.96σ", data:interpData.map(d=>({x:d.x,y:d.band196Neg})), borderColor:"#f59e0b", borderWidth:1,pointRadius:0},
        {label:"工艺公差 +0.002", data:interpData.map(d=>({x:d.x,y:0.002})), borderColor:"#ef4444", borderWidth:1,pointRadius:0,borderDash:[5,5]},
        {label:"工艺公差 -0.002", data:interpData.map(d=>({x:d.x,y:-0.002})), borderColor:"#ef4444", borderWidth:1,pointRadius:0,borderDash:[5,5]}
      ]
    },
    options:{responsive:true, scales:{x:{type:"linear",title:{text:"X",display:true}},y:{title:{text:"Y(mm)",display:true}}}}
  })
}
function drawResidual(data){
  const ctx = document.getElementById("chartResidual").getContext('2d');
  if(chartRes) chartRes.destroy();
  chartRes = new Chart(ctx,{
    type:"scatter",
    data:{
      datasets:[
        {label:"残差 e = Y实测-Y趋势", data:data.map(d=>({x:d.x,y:d.residual})), backgroundColor:"#7c3aed", pointRadius:4},
        {label:"0基准线", data:[{x:data[0].x,y:0},{x:data[data.length-1].x,y:0}], borderColor:"#333",showLine:true,pointRadius:0},
        {label:"公差±0.002", data:[{x:data[0].x,y:0.002},{x:data[data.length-1].x,y:0.002}], borderColor:"red", borderDash:[4,4],showLine:true,pointRadius:0},
        {label:"公差-0.002", data:[{x:data[0].x,y:-0.002},{x:data[data.length-1].x,y:-0.002}], borderColor:"red", borderDash:[4,4],showLine:true,pointRadius:0}
      ]
    },
    options:{responsive:true, scales:{x:{type:"linear",title:{text:"X"}},y:{title:{text:"残差(mm)"}}}}
  })
}

//全局保存插值预测数据，用于复制
let globalInterpData = [];

function runCalc(){
  const points = readTablePoints();
  if(points.length<3){
    document.getElementById("residualOut").innerHTML = "<p>至少填写3组有效的X,Y标定数据！</p>";
    document.getElementById("predictOut").innerHTML = "";
    if(chartMain) chartMain.destroy();
    if(chartRes) chartRes.destroy();
    return;
  }
  const mode = document.getElementById("calcMode").value;
  const interpTotal = parseInt(document.getElementById("interpCount").value);
  const xStart = parseFloat(document.getElementById("xStart").value);
  const xEnd = parseFloat(document.getElementById("xEnd").value);

  if(isNaN(xStart) || isNaN(xEnd) || xStart >= xEnd){
    alert("插值起始X必须小于终止X！");
    return;
  }

  let rawResultData;
  let interpResultData;
  let maxPosRes=-999, maxNegRes=999;

  if(mode === "sliding"){
    const win = parseInt(document.getElementById("winSize").value);
    rawResultData = slidingCalcRawPoints(points, win);
    interpResultData = generateInterpolatePoints(points, interpTotal, win, "sliding", 0, xStart, xEnd);
  }else{
    const order = parseInt(document.getElementById("polyOrder").value);
    const polyRet = polyCalc(points, order);
    rawResultData = polyRet.res;
    interpResultData = generateInterpolatePoints(points, interpTotal, 0, "poly", order, xStart, xEnd);
  }
  globalInterpData = interpResultData;

  //遍历求残差极值
  for(let d of rawResultData){
    if(d.residual>maxPosRes) maxPosRes = d.residual;
    if(d.residual<maxNegRes) maxNegRes = d.residual;
  }

  //==== 模块1：标定测点残差结果表（原有）====
  let htmlRes = `<p>最大正残差 = ${maxPosRes.toFixed(6)} mm<br>最大负残差 = ${maxNegRes.toFixed(6)} mm</p>`;
  htmlRes += `<table>
  <thead>
    <tr>
      <th>X</th>
      <th>Y实测</th>
      <th>Y补偿趋势</th>
      <th>残差e</th>
      <th>局部σ_local</th>
      <th>工艺波动区间 ±1σ</th>
      <th>局部置信区间 ±1.96σ</th>
    </tr>
  </thead><tbody>`;
  for(let d of rawResultData){
    htmlRes += `<tr>
    <td>${d.x.toFixed(6)}</td>
    <td>${d.yMeas.toFixed(6)}</td>
    <td>${d.yTrend.toFixed(6)}</td>
    <td>${d.residual.toFixed(6)}</td>
    <td>${d.sigmaLocal.toFixed(6)}</td>
    <td>±${d.sigmaLocal.toFixed(6)}</td>
    <td>±${(d.sigmaLocal*1.96).toFixed(6)}</td>
    </tr>`;
  }
  htmlRes += `</tbody></table>`;
  document.getElementById("residualOut").innerHTML = htmlRes;

  //==== 模块2：新增【连续插值预测补偿点表格】====
  let htmlPredict = `<table>
  <thead>
    <tr>
      <th>X坐标</th>
      <th>预测补偿Y值</th>
      <th>±1σ上限</th>
      <th>±1σ下限</th>
    </tr>
  </thead><tbody>`;
  for(let d of interpResultData){
    htmlPredict += `<tr>
    <td>${d.x.toFixed(6)}</td>
    <td>${d.yTrend.toFixed(6)}</td>
    <td>${d.band1.toFixed(6)}</td>
    <td>${d.band1Neg.toFixed(6)}</td>
    </tr>`;
  }
  htmlPredict += `</tbody></table>`;
  document.getElementById("predictOut").innerHTML = htmlPredict;

  drawMain(rawResultData, interpResultData);
  drawResidual(rawResultData);
}

//复制预测点文本（制表符分割，粘贴Excel/机床）
function copyPredictTable(){
  let txt = "X\tY补偿预测值\tSigma上限\tSigma下限\n";
  for(let d of globalInterpData){
    txt += `${d.x.toFixed(6)}\t${d.yTrend.toFixed(6)}\t${d.band1.toFixed(6)}\t${d.band1Neg.toFixed(6)}\n`;
  }
  navigator.clipboard.writeText(txt).then(()=>{
    alert("✅ 预测补偿点已复制！直接粘贴到Excel或者西门子补偿表");
  }).catch(err=>{
    alert("复制失败，请手动复制表格");
  })
}
