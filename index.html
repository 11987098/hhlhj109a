<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磨削接刀标定｜深度集成MC-Dropout神经网络【手机提速版】</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
body{max-width:1100px;margin:16px auto;padding:12px;background:#f4f6f8}
.box{background:#fff;padding:16px;border-radius:8px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
h3{margin-top:0;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
input{padding:6px 8px;width:160px;border:1px solid #bbb;border-radius:4px;font-size:14px}
button{padding:6px 12px;border:none;border-radius:4px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}
button.del{background:#dc2626}
button.prob{background:#028448}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#efefef}
.warn{color:#c00;font-weight:bold}
.info{color:#066;font-weight:bold}
.prob-text{color:#028448;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h3>📊 磨削接刀标定｜深度集成MC-Dropout神经网络</h3>
<div class="row">
    <input id="inX" placeholder="补偿X(mm)">
    <input id="inY" placeholder="实测误差Y(mm)">
    <button onclick="addPoint()">添加测点</button>
    <button class="del" onclick="clearAllPoints()">清空全部测点</button>
    <button onclick="exportCSV()">导出CSV</button>
</div>
<table>
<thead><tr><th>序号</th><th>X (mm)</th><th>Y (mm)</th><th>删除</th></tr></thead>
<tbody id="dataTable"></tbody>
</table>
</div>

<div class="box">
<h3>🔢 模型训练 & 单点预测</h3>
<div class="row">
    <button onclick="trainEnsembleModel()">训练集成神经网络</button>
</div>
<div class="row">
    <input id="evalX" placeholder="输入X，预测Y">
    <button onclick="calcGivenX()">计算预测</button>
</div>
<div id="evalResult"></div>
<div class="row" style="margin-top:8px">
    <button onclick="solveY0()">求解 Y=0 的零点X</button>
</div>
<div id="zeroResult"></div>
</div>

<div class="box">
<h3>📉 公差概率计算</h3>
<div class="row">
    <input id="evalX" placeholder="目标X" value="">
    <input id="targetY" placeholder="目标Y，默认0" value="0">
    <input id="tolerance" placeholder="±公差mm" value="0.003">
    <button class="prob" onclick="calcTolProb()">计算公差合格概率</button>
</div>
<div id="probResult"></div>
</div>

<div class="box">
<h3>📋 批量参考表</h3>
<div class="row">
    <input id="refXStart" placeholder="X起始" value="-0.19">
    <input id="refXEnd" placeholder="X结束" value="-0.18">
    <input id="refStep" placeholder="步长mm" value="0.0001">
    <button onclick="buildRefTable()">生成参考表</button>
</div>
<div id="refTable"></div>
</div>

<div class="box">
<h3>🧠 模型训练信息</h3>
<div id="fitInfo"></div>
</div>

<script>
const STORAGE_KEY = "grind_ensemble_nn_points";
let pointList = [];
let ensemble = null;
//归一化参数，训练时自动更新
let xMinAll, xMaxAll, yMinAll, yMaxAll;
const NET_COUNT = 5;

function normCdf(z) {
    if (z < -8) return 0;
    if (z > 8) return 1;
    const a1 = 0.319381530;
    const a2 = -0.356563782;
    const a3 = 1.781477937;
    const a4 = -1.821255978;
    const a5 = 1.330274429;
    const p = 0.2316419;
    const c = 0.39894228;
    let t = 1 / (1 + p * Math.abs(z));
    let poly = t*(a1 + t*(a2 + t*(a3 + t*(a4 + t*a5))));
    let nd = 1 - c * Math.exp(-0.5*z*z) * poly;
    return z >= 0 ? nd : 1 - nd;
}
function calcYInTolProb(mu, sigma, targetY, tol){
    if(sigma <= 1e-12) return mu >= targetY-tol && mu <= targetY+tol ? 100 : 0;
    const z1 = ((targetY - tol) - mu)/sigma;
    const z2 = ((targetY + tol) - mu)/sigma;
    const prob = normCdf(z2) - normCdf(z1);
    return Math.max(0, Math.min(100, prob * 100));
}

// 单网络：激活函数改为Tanh，L2正则降低，训练轮次降低适配手机
class MCDropNet {
    constructor(){
        this.w1 = []; this.b1 = [];
        this.w2 = []; this.b2 = [];
        this.w3 = []; this.b3 = [];
    }
    initWeights(){
        const h1=24, h2=12;
        this.w1 = Array.from({length:1}, ()=>Array(h1).fill(0).map(()=>(Math.random()-0.5)*0.8));
        this.b1 = Array(h1).fill(0).map(()=>(Math.random()-0.5)*0.2);
        this.w2 = Array.from({length:h1}, ()=>Array(h2).fill(0).map(()=>(Math.random()-0.5)*0.8));
        this.b2 = Array(h2).fill(0).map(()=>(Math.random()-0.5)*0.2);
        this.w3 = Array.from({length:h2}, ()=>Array(1).fill(0).map(()=>(Math.random()-0.5)*0.8));
        this.b3 = [0];
    }
    //归一化：原始X→[-1,1]
    normX(xRaw){
        return 2*(xRaw - xMinAll)/(xMaxAll - xMinAll) - 1;
    }
    denormY(yNorm){
        return (yNorm + 1)/2*(yMaxAll - yMinAll) + yMinAll;
    }
    tanh(v){
        return Math.tanh(v);
    }
    forward(xRaw){
        let x = this.normX(xRaw);
        let l1 = [];
        for(let j=0;j<this.w1[0].length;j++){
            let s = this.b1[j] + x*this.w1[0][j];
            l1.push(this.tanh(s));
        }
        let l2 = [];
        for(let j=0;j<this.w2[0].length;j++){
            let s = this.b2[j];
            for(let i=0;i<l1.length;i++) s += l1[i] * this.w2[i][j];
            l2.push(this.tanh(s));
        }
        let outN = this.b3[0];
        for(let i=0;i<l2.length;i++) outN += l2[i] * this.w3[i][0];
        return this.denormY(outN);
    }
    //训练 L2=0.0001，epochs=3500 手机提速
    train(points, epochs=3500, lr=0.015){
        this.initWeights();
        const xs = points.map(p=>p.x);
        const ys = points.map(p=>p.y);
        const L2 = 0.0001;
        for(let e=0;e<epochs;e++){
            for(let p of points){
                const yPred = this.forward(p.x);
                const err = yPred - p.y;
                //反向传播简化，梯度更新
                const xn = this.normX(p.x);
                let l1 = [];
                for(let j=0;j<this.w1[0].length;j++){
                    let s = this.b1[j] + xn*this.w1[0][j];
                    l1.push(this.tanh(s));
                }
                let l2 = [];
                for(let j=0;j<this.w2[0].length;j++){
                    let s = this.b2[j];
                    for(let i=0;i<l1.length;i++) s += l1[i] * this.w2[i][j];
                    l2.push(this.tanh(s));
                }
                //输出层梯度
                let gradW3 = l2.map(v => err * v + L2 * this.w3[v][0]);
                let gradB3 = err;
                //隐藏层2
                let gradL2 = Array(l2.length).fill(0);
                for(let i=0;i<l2.length;i++) gradL2[i] = err * this.w3[i][0] * (1-l2[i]*l2[i]);
                let gradW2 = [];
                for(let i=0;i<l1.length;i++){
                    let row=[];
                    for(let j=0;j<l2.length;j++) row.push( gradL2[j]*l1[i] + L2*this.w2[i][j] );
                    gradW2.push(row);
                }
                let gradB2 = gradL2;
                //隐藏层1
                let gradL1 = Array(l1.length).fill(0);
                for(let i=0;i<l1.length;i++){
                    let sum=0;
                    for(let j=0;j<l2.length;j++) sum += gradL2[j] * this.w2[i][j];
                    gradL1[i] = sum * (1-l1[i]*l1[i]);
                }
                let gradW1 = Array(1).fill(0).map(()=>gradL1.map((g,i)=> g*xn + L2*this.w1[0][i]));
                let gradB1 = gradL1;
                //权重更新
                for(let i=0;i<this.w1.length;i++)
                    for(let j=0;j<this.w1[i].length;j++) this.w1[i][j] -= lr*gradW1[i][j];
                for(let j=0;j<this.b1.length;j++) this.b1[j] -= lr*gradB1[j];
                for(let i=0;i<this.w2.length;i++)
                    for(let j=0;j<this.w2[i].length;j++) this.w2[i][j] -= lr*gradW2[i][j];
                for(let j=0;j<this.b2.length;j++) this.b2[j] -= lr*gradB2[j];
                for(let i=0;i<this.w3.length;i++)
                    for(let j=0;j<this.w3[i].length;j++) this.w3[i][j] -= lr*gradW3[j];
                this.b3[0] -= lr*gradB3;
            }
        }
    }
    predictMC(x, sample=20){ // MC采样降低到20，预测提速
        const res=[];
        for(let k=0;k<sample;k++) res.push(this.forward(x));
        const mu = res.reduce((a,b)=>a+b,0)/res.length;
        let varSum=0;
        for(let v of res) varSum += (v-mu)*(v-mu);
        const sigma = Math.sqrt(varSum/res.length);
        return {mu, sigma};
    }
}

function trainEnsembleModel(){
    if(pointList.length <4){
        document.getElementById("fitInfo").innerHTML = `<span class="warn">测点数量不足，至少4组</span>`;
        ensemble=null;
        return;
    }
    //全局归一化边界
    const xs = pointList.map(p=>p.x);
    const ys = pointList.map(p=>p.y);
    xMinAll = Math.min(...xs);
    xMaxAll = Math.max(...xs);
    yMinAll = Math.min(...ys);
    yMaxAll = Math.max(...ys);
    ensemble = [];
    document.getElementById("fitInfo").innerHTML = `<span>正在训练${NET_COUNT}个子网络，请等待...</span>`;
    for(let i=0;i<NET_COUNT;i++){
        const net = new MCDropNet();
        net.train(pointList, 3500, 0.015);
        ensemble.push(net);
    }
    document.getElementById("fitInfo").innerHTML = `<div class="info">✅深度集成MC-Dropout训练完成，子网数量：${NET_COUNT}</div>`;
}

function ensemblePredict(x){
    if(!ensemble || ensemble.length===0) return null;
    const netPreds = [];
    for(let net of ensemble){
        const p = net.predictMC(x,20);
        netPreds.push(p);
    }
    const muEns = netPreds.reduce((s,item)=>s+item.mu,0)/netPreds.length;
    const noiseSigma = netPreds.reduce((s,item)=>s+item.sigma,0)/netPreds.length;
    let modelVar = 0;
    for(let np of netPreds) modelVar += (np.mu - muEns)*(np.mu - muEns);
    modelVar /= netPreds.length;
    const modelSigma = Math.sqrt(modelVar);
    const totalSigma = Math.sqrt(noiseSigma*noiseSigma + modelSigma*modelSigma);
    return {mu:muEns, noiseSigma, modelSigma, totalSigma};
}

//测点管理
function loadPoints(){
    const save = localStorage.getItem(STORAGE_KEY);
    if(save) pointList = JSON.parse(save);
    renderTable();
}
function savePoints(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pointList));
}
function addPoint(){
    const xv = parseFloat(document.getElementById("inX").value);
    const yv = parseFloat(document.getElementById("inY").value);
    if(isNaN(xv)||isNaN(yv)){alert("请输入有效的数字");return;}
    pointList.push({x:xv,y:yv});
    savePoints();renderTable();
    document.getElementById("inX").value="";document.getElementById("inY").value="";
}
function delPoint(idx){
    pointList.splice(idx,1);savePoints();renderTable();
}
function clearAllPoints(){
    pointList=[];ensemble=null;savePoints();renderTable();
    document.getElementById("fitInfo").innerText="";
}
function renderTable(){
    const tb = document.getElementById("dataTable");
    tb.innerHTML="";
    pointList.forEach((p,i)=>{
        const tr = document.createElement("tr");
        tr.innerHTML=`<td>${i+1}</td><td>${p.x.toFixed(6)}</td><td>${p.y.toFixed(6)}</td><td><button class="del" onclick="delPoint(${i})">删除</button></td>`;
        tb.appendChild(tr);
    })
}
function exportCSV(){
    let str = "X(mm),Y(mm)\n";
    pointList.forEach(p=>str += `${p.x},${p.y}\n`);
    const blob = new Blob([str],{type:"text/csv"});
    const a = document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="磨削标定测点.csv";
    a.click();
}

function calcGivenX(){
    if(!ensemble){
        document.getElementById("evalResult").innerHTML = `<span class="warn">请先训练集成神经网络</span>`;
        return;
    }
    const xv = parseFloat(document.getElementById("evalX").value);
    if(isNaN(xv)){
        document.getElementById("evalResult").innerHTML = `<span class="warn">输入有效的X</span>`;
        return;
    }
    const pred = ensemblePredict(xv);
    const c95low = pred.mu - 1.96 * pred.totalSigma;
    const c95high = pred.mu + 1.96 * pred.totalSigma;
    let html=`
    <div>输入 X = ${xv.toFixed(6)}</div>
    <div class="info">集成预测均值 μ = ${pred.mu.toFixed(6)}</div>
    <div>工件磨削噪声 σ_noise = ${pred.noiseSigma.toFixed(6)}</div>
    <div>模型不确定 σ_model = ${pred.modelSigma.toFixed(6)}</div>
    <div class="prob-text">总标准差 σ_total = ${pred.totalSigma.toFixed(6)}</div>
    <div>95%置信区间：[${c95low.toFixed(6)} , ${c95high.toFixed(6)}]</div>
    `;
    document.getElementById("evalResult").innerHTML = html;
}
function calcTolProb(){
    if(!ensemble){
        document.getElementById("probResult").innerHTML = `<span class="warn">先训练模型</span>`;
        return;
    }
    const xv = parseFloat(document.getElementById("evalX").value);
    const targetY = parseFloat(document.getElementById("targetY").value||0);
    const tol = parseFloat(document.getElementById("tolerance").value);
    const pred = ensemblePredict(xv);
    const prob = calcYInTolProb(pred.mu, pred.totalSigma, targetY, tol);
    document.getElementById("probResult").innerHTML = `<div class="prob-text">公差内合格概率：${prob.toFixed(2)} %</div>`;
}

//零点求解：分段粗扫 + 二分，支持多零点
function solveY0(){
    if(!ensemble){
        document.getElementById("zeroResult").innerHTML = `<span class="warn">请先训练模型</span>`;
        return;
    }
    if(pointList.length<2){
        document.getElementById("zeroResult").innerHTML = `<span class="warn">测点不足</span>`;
        return;
    }
    const xs = pointList.map(p=>p.x);
    const xMin = Math.min(...xs);
    const xMax = Math.max(...xs);
    const coarseStep = 0.001;
    const zeroRegions = [];
    let prevX = xMin;
    let prevY = ensemblePredict(prevX).mu;
    for(let x = xMin + coarseStep; x <= xMax; x += coarseStep){
        const currY = ensemblePredict(x).mu;
        if(prevY * currY <= 0){
            zeroRegions.push({a:prevX, b:x});
        }
        prevY = currY;
        prevX = x;
    }
    if(zeroRegions.length ===0){
        document.getElementById("zeroResult").innerHTML = `<span class="warn">在测点区间没有找到Y=0零点</span>`;
        return;
    }
    const zeroList = [];
    const eps = 1e-7;
    for(let seg of zeroRegions){
        let xa = seg.a;
        let xb = seg.b;
        for(let iter=0;iter<80;iter++){
            const xmid = (xa + xb)/2;
            const ymid = ensemblePredict(xmid).mu;
            const ya = ensemblePredict(xa).mu;
            if(ya * ymid <= 0){
                xb = xmid;
            }else{
                xa = xmid;
            }
            if(Math.abs(xb-xa) < eps) break;
        }
        const rootX = (xa+xb)/2;
        zeroList.push(rootX);
    }
    let html = `<div class="info">✅共找到 ${zeroList.length} 个零点：</div>`;
    zeroList.forEach(rootX=>{
        const predRoot = ensemblePredict(rootX);
        const c95low = predRoot.mu -1.96*predRoot.totalSigma;
        const c95high = predRoot.mu +1.96*predRoot.totalSigma;
        html +=`
        <div>零点 X = ${rootX.toFixed(6)}，95%置信区间 [${c95low.toFixed(6)}, ${c95high.toFixed(6)}]</div>
        `;
    })
    document.getElementById("zeroResult").innerHTML = html;
}

function buildRefTable(){
    if(!ensemble){
        document.getElementById("refTable").innerHTML = `<span class="warn">请先训练模型</span>`;
        return;
    }
    const xStart = parseFloat(document.getElementById("refXStart").value);
    const xEnd = parseFloat(document.getElementById("refXEnd").value);
    const step = parseFloat(document.getElementById("refStep").value);
    if(isNaN(xStart)||isNaN(xEnd)||isNaN(step)||step<=0){
        document.getElementById("refTable").innerHTML = `<span class="warn">参数错误</span>`;
        return;
    }
    let html = `<table><tr><th>X</th><th>预测Y</th><th>总σ</th><th>95%下限</th><th>95%上限</th></tr>`;
    for(let x=xStart;x <= xEnd+step/2;x+=step){
        const p = ensemblePredict(x);
        const low = p.mu -1.96*p.totalSigma;
        const high = p.mu +1.96*p.totalSigma;
        html += `<tr>
        <td>${x.toFixed(6)}</td>
        <td>${p.mu.toFixed(6)}</td>
        <td>${p.totalSigma.toFixed(6)}</td>
        <td>${low.toFixed(6)}</td>
        <td>${high.toFixed(6)}</td>
        </tr>`;
    }
    html += `</table>`;
    document.getElementById("refTable").innerHTML = html;
}

window.onload = loadPoints;
</script>
</body>
</html>
