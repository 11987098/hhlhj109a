<!-- ========== 公差约束概率寻优模块，输入框带注释，本地记忆 ========== -->
<div class="box">
<h3 class="prob-text">📉 公差约束概率寻优 | 限定Y±公差范围</h3>
<div class="row">
    <!--目标Y：理想接刀误差，一般填0，代表目标误差0mm-->
    <input id="targetY" placeholder="目标Y(理想接刀误差，一般填0)">

    <input id="tolerance" placeholder="允许±公差 mm，例0.002">
    <!--高斯核带宽：测点加权影响半径；磨削推荐0.001~0.005-->
    <input id="kernelSigma" placeholder="高斯核带宽mm，推荐0.001~0.005">
    <button class="prob" onclick="calcToleranceOptimal()">查找满足公差的最优X</button>
</div>

<script>
//存储KEY：设备数据 + 全局全部输入参数
const STORAGE_KEY_DEV = "grind_calib_devices";
const STORAGE_KEY_GLOBAL = "grind_calib_global_setting";
let deviceList = [];
let activeDeviceId = null;
let currentFitCoef = null;
let currentFitOrder = 2;
let currentLagOrder = 4;

// 默认全局参数：所有输入框
const DEFAULT_GLOBAL = {
    targetY:"0.0000",
    tolerance:"0.002",
    kernelSigma:"0.001",
    refXStart:"-0.19",
    refXEnd:"-0.18",
    refStep:"0.0001",
    evalX:""
};

// ======================【数学工具：标准正态分布CDF】======================
function normCdf(z) {
    if (z < -8) return 0;
    if (z > 8) return 1;
    const a1 = 0.319381530;
    const a2 = -0.356563782;
    const a3 = 1.781477937;
    const a4 = -1.821255978;
    const a5 = 1.330274429;
    const p = 0.2316419;
    const c = 0.39894228;
    let t = 1 / (1 + p * Math.abs(z));
    let poly = t*(a1 + t*(a2 + t*(a3 + t*(a4 + t*a5))));
    let nd = 1 - c * Math.exp(-0.5*z*z) * poly;
    return z >= 0 ? nd : 1 - nd;
}

// ======================【高斯核加权统计函数】======================
function gaussianWeightStats(xQuery, points, kernelSigma) {
    let sumW = 0;
    let sumWY = 0;
    let sumWY2 = 0;
    for(let p of points){
        const dx = p.x - xQuery;
        const w = Math.exp(-(dx*dx)/(2*kernelSigma*kernelSigma));
        sumW += w;
        sumWY += w * p.y;
        sumWY2 += w * p.y * p.y;
    }
    if(sumW < 1e-12){
        return {mu:NaN, sigma:NaN, totalWeight:0};
    }
    const mu = sumWY / sumW;
    const varY = sumWY2 / sumW - mu*mu;
    const sigma = Math.sqrt(Math.max(varY, 1e-12));
    return {mu, sigma, totalWeight:sumW};
}

function calcYInTolProb(mu, sigma, targetY, tol){
    if(sigma <= 1e-12) return mu >= targetY-tol && mu <= targetY+tol ? 100 : 0;
    const z1 = ( (targetY - tol) - mu ) / sigma;
    const z2 = ( (targetY + tol) - mu ) / sigma;
    const prob = normCdf(z2) - normCdf(z1);
    return Math.max(0, Math.min(100, prob * 100));
}

function findToleranceOptimalX(points, targetY, tolerance, kernelSigma, sampleCount=500){
    const xs = points.map(p=>p.x);
    const xMin = Math.min(...xs);
    const xMax = Math.max(...xs);
    const lowerBound = targetY - tolerance;
    const upperBound = targetY + tolerance;

    let bestX = NaN;
    let bestMu = NaN;
    let bestSigma = NaN;
    let bestGap = Infinity;
    let hasValidRegion = false;

    const step = (xMax - xMin)/sampleCount;
    for(let i=0; i<=sampleCount; i++){
        const xEval = xMin + i * step;
        const stat = gaussianWeightStats(xEval, points, kernelSigma);
        if(isNaN(stat.mu)) continue;
        const confLow = stat.mu - 1.96 * stat.sigma;
        const confHigh = stat.mu + 1.96 * stat.sigma;

        const satisfyTol = (confLow >= lowerBound - 1e-12) && (confHigh <= upperBound +1e-12);
        if(satisfyTol){
            hasValidRegion = true;
            const gapToTarget = Math.abs(stat.mu - targetY);
            if(gapToTarget < bestGap){
                bestGap = gapToTarget;
                bestX = xEval;
                bestMu = stat.mu;
                bestSigma = stat.sigma;
            }
        }
    }

    if(!hasValidRegion){
        let fallbackX = NaN;
        let fallbackMu = NaN;
        let fallbackSigma = NaN;
        let minAbsY = Infinity;
        for(let i=0; i<=sampleCount; i++){
            const xEval = xMin + i * step;
            const stat = gaussianWeightStats(xEval, points, kernelSigma);
            if(isNaN(stat.mu)) continue;
            const absY = Math.abs(stat.mu - targetY);
            if(absY < minAbsY){
                minAbsY = absY;
                fallbackX = xEval;
                fallbackMu = stat.mu;
                fallbackSigma = stat.sigma;
            }
        }
        return {
            hasValid:false,
            bestX:fallbackX,
            bestMu:fallbackMu,
            bestSigma:fallbackSigma,
            xMin,xMax,lowerBound,upperBound
        }
    }
    return {
        hasValid:true,
        bestX,bestMu,bestSigma,
        xMin,xMax,lowerBound,upperBound
    }
}

function calcToleranceOptimal(){
    const probDiv = document.getElementById("probResult");
    const dev = getActiveDevice();
    if(!dev || dev.points.length <3){
        probDiv.innerHTML = `<span class="warn">测点至少需要3个，才能做概率统计估算</span>`;
        return;
    }
    const targetY = parseFloat(document.getElementById("targetY").value);
    const tolerance = parseFloat(document.getElementById("tolerance").value);
    const kernelSigma = parseFloat(document.getElementById("kernelSigma").value);
    saveGlobalSetting();
    if(isNaN(targetY) || isNaN(tolerance) || isNaN(kernelSigma) || kernelSigma <=0 || tolerance <=0){
        probDiv.innerHTML = `<span class="warn">参数非法：公差、高斯带宽必须>0</span>`;
        return;
    }
    const res = findToleranceOptimalX(dev.points, targetY, tolerance, kernelSigma);
    if(isNaN(res.bestX)){
        probDiv.innerHTML = `<span class="warn">搜索失败，请检查测点或高斯带宽</span>`;
        return;
    }
    const conf95Low = res.bestMu - 1.96 * res.bestSigma;
    const conf95High = res.bestMu + 1.96 * res.bestSigma;
    const passProb = calcYInTolProb(res.bestMu, res.bestSigma, targetY, tolerance);
    let html = "";
    if(res.hasValid){
        html += `<div class="prob-text">✅找到满足±${tolerance.toFixed(6)}公差的最优补偿X</div>`;
    }else{
        html += `<div class="warn">❌警告：**机床固有波动过大，不存在X可以稳定满足±${tolerance.toFixed(6)}公差**</div>`;
        html += `<div class="warn">下面是均值最接近目标的备选补偿值，但95%概率区间会超出设定公差！</div>`;
    }
    html += `
    <div>搜索区间 X ∈ [${res.xMin.toFixed(4)}, ${res.xMax.toFixed(4)}]</div>
    <div>目标Y = ${targetY.toFixed(6)}，允许范围：Y ∈ [${res.lowerBound.toFixed(6)}, ${res.upperBound.toFixed(6)}]</div>
    <div><b>推荐补偿 X = ${res.bestX.toFixed(6)} mm</b></div>
    <div>该位置预测平均误差 μ = ${res.bestMu.toFixed(6)} mm</div>
    <div>Y重复波动标准差 σ = ${res.bestSigma.toFixed(6)} mm</div>
    <div>95%置信区间 Y ∈ [${conf95Low.toFixed(6)}, ${conf95High.toFixed(6)}] mm</div>
    <div class="prob-text">✅落在公差内理论概率：${passProb.toFixed(2)} %</div>
    `;
    if(res.hasValid){
        html += `<div class="info">✅置信区间完全落在公差带内，在统计意义上，95%加工结果满足公差。</div>`;
    }else{
        html += `<div class="warn">⚠️机床本身的重复波动大于设定公差，即使调整补偿，依然有大概率超差，优先检修机床稳定性。</div>`;
    }
    html += `<div class="warn">⚠️统计计算值，上机前必须小步微调验证！</div>`;
    probDiv.innerHTML=html;
}

// ==========【多项式拟合核心，最小二乘】==========
function polyFit(points, order) {
    const n = points.length;
    if(order >= n) return null;
    let X = Array.from({length:order+1},()=>Array(order+1).fill(0));
    let Y = Array(order+1).fill(0);
    for(let p of points){
        let xi = 1;
        for(let i=0;i<=order;i++){
            let xj = 1;
            for(let j=0;j<=order;j++){
                X[i][j] += xi * xj;
                xj *= p.x;
            }
            Y[i] += xi * p.y;
            xi *= p.x;
        }
    }
    //高斯消元
    for(let i=0;i<=order;i++){
        let pivot = i;
        for(let r=i;r<=order;r++) if(Math.abs(X[r][i])>Math.abs(X[pivot][i])) pivot=r;
        [X[i],X[pivot]] = [X[pivot],X[i]];
        [Y[i],Y[pivot]] = [Y[pivot],Y[i]];
        const div = X[i][i];
        if(Math.abs(div)<1e-12) return null;
        for(let j=i;j<=order;j++) X[i][j]/=div;
        Y[i]/=div;
        for(let r=0;r<=order;r++){
            if(r!==i && Math.abs(X[r][i])>1e-12){
                const factor = X[r][i];
                for(let j=i;j<=order;j++) X[r][j]-=factor*X[i][j];
                Y[r]-=factor*Y[i];
            }
        }
    }
    return Y;
}

function evalPoly(coef, x){
    let res = 0;
    let xPow = 1;
    for(let c of coef){
        res += c*xPow;
        xPow *= x;
    }
    return res;
}

// 拉格朗日插值
function lagrangeEval(points, order, x){
    const pts = [...points].sort((a,b)=>a.x-b.x);
    const n = pts.length;
    const useN = Math.min(order+1, n);
    let sum = 0;
    for(let i=0;i<useN;i++){
        let li = 1;
        for(let j=0;j<useN;j++){
            if(i===j) continue;
            li *= (x - pts[j].x)/(pts[i].x - pts[j].x);
        }
        sum += li * pts[i].y;
    }
    return sum;
}

// 刷新多项式阶下拉框，最大阶 = 测点数量 - 1
function refreshFitOrderSelect(){
    const dev = getActiveDevice();
    const sel = document.getElementById("fitOrderSelect");
    sel.innerHTML = "";
    const ptCnt = dev.points.length;
    const maxO = ptCnt - 1;
    if(maxO <1){
        sel.innerHTML = `<option value="0">0阶（测点不足）</option>`;
        return;
    }
    for(let o=1;o<=maxO;o++){
        const opt = document.createElement("option");
        opt.value = o;
        opt.innerText = `${o}阶多项式`;
        sel.appendChild(opt);
    }
    // 选中当前阶，超限自动修正
    if(currentFitOrder > maxO) currentFitOrder = maxO;
    sel.value = currentFitOrder;
    onFitOrderChange();
}
function refreshLagOrderSelect(){
    const dev = getActiveDevice();
    const sel = document.getElementById("lagOrderSelect");
    sel.innerHTML = "";
    const ptCnt = dev.points.length;
    const maxO = ptCnt-1;
    if(maxO <2){
        sel.innerHTML = `<option value="2">2阶（测点不足）</option>`;
        return;
    }
    for(let o=2;o<=maxO;o++){
        const opt = document.createElement("option");
        opt.value = o;
        opt.innerText = `${o}阶拉格朗日`;
        sel.appendChild(opt);
    }
    if(currentLagOrder>maxO) currentLagOrder = maxO;
    sel.value = currentLagOrder;
}
function onFitOrderChange(){
    currentFitOrder = parseInt(document.getElementById("fitOrderSelect").value);
    saveGlobalSetting();
    recalcFit();
}
function onLagOrderChange(){
    currentLagOrder = parseInt(document.getElementById("lagOrderSelect").value);
    saveGlobalSetting();
}
function recalcFit(){
    const dev = getActiveDevice();
    const coef = polyFit(dev.points, currentFitOrder);
    currentFitCoef = coef;
    const div = document.getElementById("fitInfo");
    if(!coef){
        div.innerHTML = `<span class="warn">拟合失败，奇异矩阵，请更换测点或降低阶数</span>`;
        return;
    }
    div.innerHTML = `<div class="info">✅多项式拟合成功，系数 a0+a1*x+a2*x²...<br>系数：[${coef.map(v=>v.toFixed(6)).join(", ")}]</div>`;
}

function calcGivenX(){
    saveGlobalSetting();
    const dev = getActiveDevice();
    const xv = parseFloat(document.getElementById("evalX").value);
    if(isNaN(xv)){
        document.getElementById("evalResult").innerHTML = `<span class="warn">请输入有效的X</span>`;
        return;
    }
    if(!currentFitCoef){
        document.getElementById("evalResult").innerHTML = `<span class="warn">先做多项式拟合</span>`;
        return;
    }
    const yPoly = evalPoly(currentFitCoef, xv);
    const yLag = lagrangeEval(dev.points, currentLagOrder, xv);
    document.getElementById("evalResult").innerHTML = `
        <div>X=${xv.toFixed(6)}</div>
        <div>多项式Y = ${yPoly.toFixed(6)}</div>
        <div>拉格朗日Y = ${yLag.toFixed(6)}</div>
    `;
}

function solveY0(){
    saveGlobalSetting();
    if(!currentFitCoef){
        document.getElementById("zeroResult").innerHTML = `<span class="warn">先拟合多项式</span>`;
        return;
    }
    const dev = getActiveDevice();
    const pts = dev.points;
    const xMin = Math.min(...pts.map(p=>p.x));
    const xMax = Math.max(...pts.map(p=>p.x));
    let rootX = NaN;
    let yPrev = evalPoly(currentFitCoef, xMin);
    for(let x = xMin;x <= xMax;x += 0.00001){
        const yNow = evalPoly(currentFitCoef, x);
        if(yPrev * yNow <= 0){
            rootX = x;
            break;
        }
        yPrev = yNow;
    }
    if(isNaN(rootX)){
        document.getElementById("zeroResult").innerHTML = `<span class="warn">区间内未找到Y=0的根</span>`;
    }else{
        document.getElementById("zeroResult").innerHTML = `<div class="info">✅Y=0零点 X = ${rootX.toFixed(6)}</div>`;
    }
}

function buildToleranceProbTable(){
    saveGlobalSetting();
    const tableDiv = document.getElementById("probTable");
    const dev = getActiveDevice();
    if(!dev || dev.points.length <3){
        tableDiv.innerHTML = `<span class="warn">测点至少3个生成概率公差参考表</span>`;
        return;
    }
    const xStart = parseFloat(document.getElementById("refXStart").value);
    const xEnd = parseFloat(document.getElementById("refXEnd").value);
    const step = parseFloat(document.getElementById("refStep").value);
    const targetY = parseFloat(document.getElementById("targetY").value);
    const tolerance = parseFloat(document.getElementById("tolerance").value);
    const kernelSigma = parseFloat(document.getElementById("kernelSigma").value);
    if(isNaN(xStart)||isNaN(xEnd)||isNaN(step)||step<=0){
        tableDiv.innerHTML="<span class='warn'>参考区间参数错误</span>";
        return;
    }
    if(xStart>xEnd) [xStart,xEnd]=[xEnd,xStart];
    const lowerBound = targetY - tolerance;
    const upperBound = targetY + tolerance;
    let html = `<table><tr>
        <th>X(mm)</th>
        <th>加权均值μ(mm)</th>
        <th>标准差σ(mm)</th>
        <th>95%置信下限</th>
        <th>95%置信上限</th>
        <th>落在公差内概率%</th>
        <th>是否满足公差±${tolerance}</th>
    </tr>`;
    for(let xv=xStart; xv <= xEnd +1e-9; xv += step){
        const stat = gaussianWeightStats(xv, dev.points, kernelSigma);
        if(isNaN(stat.mu)){
            html += `<tr><td>${xv.toFixed(6)}</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td><td>--</td></tr>`;
            continue;
        }
        const cLow = stat.mu - 1.96 * stat.sigma;
        const cHigh = stat.mu + 1.96 * stat.sigma;
        const ok = (cLow >= lowerBound -1e-12) && (cHigh <= upperBound +1e-12);
        const pct = calcYInTolProb(stat.mu, stat.sigma, targetY, tolerance);
        html += `<tr>
        <td>${xv.toFixed(6)}</td>
        <td>${stat.mu.toFixed(6)}</td>
        <td>${stat.sigma.toFixed(6)}</td>
        <td>${cLow.toFixed(6)}</td>
        <td>${cHigh.toFixed(6)}</td>
        <td style="${pct>90?"color:green":pct>50?"#cc7700":"red"}">${pct.toFixed(2)}</td>
        <td style="${ok?"color:green":"color:red"}">${ok?"✅合格":"❌超差风险"}</td>
        </tr>`;
    }
    html += `</table>
    <div class="info">表格说明：✅=95%置信区间全部落在你设定的Y±公差内；❌=存在超差概率</div>
    <div class="info">公差内概率%：重复加工，尺寸落在公差区间理论百分比</div>
    <div class="warn">⚠️远离测点区域加权权重极低，统计结果可信度下降。</div>`;
    tableDiv.innerHTML = html;
}

function buildRefTable(){
    saveGlobalSetting();
    const tableDiv = document.getElementById("refTable");
    const dev = getActiveDevice();
    if(!dev || dev.points.length <3){
        tableDiv.innerHTML = `<span class="warn">至少3个测点生成调机表</span>`;
        return;
    }
    const xStart = parseFloat(document.getElementById("refXStart").value);
    const xEnd = parseFloat(document.getElementById("refXEnd").value);
    const step = parseFloat(document.getElementById("refStep").value);
    const targetY = parseFloat(document.getElementById("targetY").value);
    const tolerance = parseFloat(document.getElementById("tolerance").value);
    const kernelSigma = parseFloat(document.getElementById("kernelSigma").value);
    if(isNaN(xStart)||isNaN(xEnd)||isNaN(step)||step<=0){
        tableDiv.innerHTML="<span class='warn'>区间参数错误</span>";
        return;
    }
    if(xStart>xEnd) [xStart,xEnd]=[xEnd,xStart];

    let html = `<table>
    <tr>
        <th>补偿X(mm)</th>
        <th>预测Y均值(mm)</th>
        <th>σ波动(mm)</th>
        <th>公差内概率%</th>
    </tr>`;
    for(let xv=xStart; xv <= xEnd +1e-9; xv += step){
        const stat = gaussianWeightStats(xv, dev.points, kernelSigma);
        if(isNaN(stat.mu)){
            html += `<tr><td>${xv.toFixed(6)}</td><td>--</td><td>--</td><td>--</td></tr>`;
            continue;
        }
        const pct = calcYInTolProb(stat.mu, stat.sigma, targetY, tolerance);
        html += `<tr>
        <td>${xv.toFixed(6)}</td>
        <td>${stat.mu.toFixed(6)}</td>
        <td>${stat.sigma.toFixed(6)}</td>
        <td style="${pct>90?"color:green":pct>50?"#cc7700":"red"}">${pct.toFixed(2)}%</td>
        </tr>`;
    }
    html += `</table>`;
    tableDiv.innerHTML = html;
}

// ========== 全局参数保存/读取：全部输入框 ==========
function saveGlobalSetting(){
    const data = {
        targetY:document.getElementById("targetY").value,
        tolerance:document.getElementById("tolerance").value,
        kernelSigma:document.getElementById("kernelSigma").value,
        refXStart:document.getElementById("refXStart").value,
        refXEnd:document.getElementById("refXEnd").value,
        refStep:document.getElementById("refStep").value,
        evalX:document.getElementById("evalX").value
    };
    localStorage.setItem(STORAGE_KEY_GLOBAL, JSON.stringify(data));
}
function loadGlobalSetting(){
    const raw = localStorage.getItem(STORAGE_KEY_GLOBAL);
    let d = {...DEFAULT_GLOBAL};
    if(raw){
        try{d = {...DEFAULT_GLOBAL, ...JSON.parse(raw)};}catch(e){d = {...DEFAULT_GLOBAL};}
    }
    document.getElementById("targetY").value = d.targetY;
    document.getElementById("tolerance").value = d.tolerance;
    document.getElementById("kernelSigma").value = d.kernelSigma;
    document.getElementById("refXStart").value = d.refXStart;
    document.getElementById("refXEnd").value = d.refXEnd;
    document.getElementById("refStep").value = d.refStep;
    document.getElementById("evalX").value = d.evalX;
}

// ==========设备管理函数============
function saveDeviceList(){
    localStorage.setItem(STORAGE_KEY_DEV, JSON.stringify(deviceList));
}
function loadDeviceList(){
    const raw = localStorage.getItem(STORAGE_KEY_DEV);
    if(raw){
        try{deviceList = JSON.parse(raw);}catch(e){deviceList=[];}
    }
}
function renderDeviceSelect(){
    const sel = document.getElementById("deviceSelect");
    sel.innerHTML = "";
    for(let d of deviceList){
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.innerText = d.name;
        sel.appendChild(opt);
    }
    if(activeDeviceId && deviceList.find(x=>x.id===activeDeviceId)){
        sel.value = activeDeviceId;
    }else if(deviceList.length>0){
        activeDeviceId = deviceList[0].id;
        sel.value = activeDeviceId;
    }
    sel.onchange = ()=>{
        activeDeviceId = sel.value;
        refreshTable();
        refreshFitOrderSelect();
        refreshLagOrderSelect();
        recalcFit();
        saveDeviceList();
    }
}
function getActiveDevice(){
    return deviceList.find(d=>d.id === activeDeviceId);
}
function createNewDevice(){
    const id = Date.now().toString();
    const name = "设备_"+(deviceList.length+1);
    deviceList.push({id,name,points:[]});
    activeDeviceId = id;
    saveDeviceList();
    renderDeviceSelect();
    refreshTable();
    refreshFitOrderSelect();
    refreshLagOrderSelect();
}
function deleteCurrentDevice(){
    if(!activeDeviceId) return;
    deviceList = deviceList.filter(d=>d.id!==activeDeviceId);
    activeDeviceId = deviceList.length>0 ? deviceList[0].id : null;
    saveDeviceList();
    renderDeviceSelect();
    refreshTable();
    refreshFitOrderSelect();
    refreshLagOrderSelect();
}
function addPoint(){
    saveGlobalSetting();
    const xv = parseFloat(document.getElementById("inX").value);
    const yv = parseFloat(document.getElementById("inY").value);
    if(isNaN(xv)||isNaN(yv)) return alert("X/Y必须是数字");
    const dev = getActiveDevice();
    dev.points.push({x:xv,y:yv});
    saveDeviceList();
    refreshTable();
    refreshFitOrderSelect();
    refreshLagOrderSelect();
    recalcFit();
}
function clearAllPoints(){
    const dev = getActiveDevice();
    dev.points = [];
    saveDeviceList();
    refreshTable();
    refreshFitOrderSelect();
    refreshLagOrderSelect();
    currentFitCoef = null;
    document.getElementById("fitInfo").innerHTML="";
}
function refreshTable(){
    const dev = getActiveDevice();
    const tb = document.getElementById("dataTable");
    tb.innerHTML = "";
    if(!dev) return;
    dev.points.forEach((p,idx)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${idx+1}</td>
            <td>${p.x}</td>
            <td>${p.y}</td>
            <td><button class="del" onclick="delPoint(${idx})">删除</button></td>
        `;
        tb.appendChild(tr);
    })
}
function delPoint(idx){
    const dev = getActiveDevice();
    dev.points.splice(idx,1);
    saveDeviceList();
    refreshTable();
    refreshFitOrderSelect();
    refreshLagOrderSelect();
    recalcFit();
}
function exportDeviceCSV(){
    const dev = getActiveDevice();
    if(!dev || dev.points.length===0) return alert("无测点");
    let csv = "X,Y\n";
    dev.points.forEach(p=>csv += `${p.x},${p.y}\n`);
    const blob = new Blob([csv],{type:"text/csv"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = dev.name+"_测点.csv";
    a.click();
}

//页面初始化
window.onload = function(){
    loadDeviceList();
    loadGlobalSetting();
    renderDeviceSelect();
    refreshTable();
    refreshFitOrderSelect();
    refreshLagOrderSelect();
    recalcFit();
}
//输入框修改自动保存
document.querySelectorAll("input").forEach(inp=>{
    inp.addEventListener("change",saveGlobalSetting);
})
</script>
