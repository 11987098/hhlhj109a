<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>磨削接刀标定计算器｜滑动窗口局部线性拟合</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif}
body{max-width:1200px;margin:16px auto;padding:12px;background:#f4f6f8}
.box{background:#fff;padding:16px;border-radius:8px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
h3{margin-top:0;font-size:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
input,select{padding:6px;border:1px solid #ccc;border-radius:4px;font-size:14px}
button{padding:7px 14px;background:#2563eb;color:#fff;border:none;border-radius:4px;cursor:pointer}
button:hover{background:#1d4ed8}
canvas{width:100% !important;height:320px !important;margin:8px 0}
table{border-collapse: collapse;width:100%;font-size:12px;margin:8px 0}
th,td{border:1px solid #ccc;padding:5px;text-align:center}
th{background:#edf2f7}
.table-input td input{width:100%;border:none;background:transparent;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h3>1、标定数据【表格输入】X / Y实测(mm)</h3>
  <table class="table-input" id="inputTable">
    <thead>
      <tr>
        <th>X</th>
        <th>Y实测</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr><td><input type="number" step="0.000001"></td><td><input type="number" step="0.000001"></td><td><button onclick="delRow(this)">删除</button></td></tr>
      <tr><td><input type="number" step="0.000001"></td><td><input type="number" step="0.000001"></td><td><button onclick="delRow(this)">删除</button></td></tr>
      <tr><td><input type="number" step="0.000001"></td><td><input type="number" step="0.000001"></td><td><button onclick="delRow(this)">删除</button></td></tr>
    </tbody>
  </table>
  <div class="row">
    <button onclick="addRow()">增加一行</button>
    <button onclick="clearTable()">清空表格</button>
  </div>
  <div class="row" style="margin-top:10px;">
    <div>计算模式：
      <select id="calcMode">
        <option value="sliding">✅滑动窗口局部线性拟合【推荐 磨削标定】</option>
        <option value="poly">多项式拟合（旧全局模式，对比用）</option>
      </select>
    </div>
    <div>滑动窗口点数：
      <select id="winSize">
        <option value="3">3点</option>
        <option value="5" selected>5点（推荐）</option>
        <option value="7">7点</option>
      </select>
    </div>
    <div>多项式阶数 <input id="polyOrder" type="number" value="4" min="1" max="12" style="width:50px"></div>
    <div>插值点数<input id="interpCount" type="number" value="100" min="20" max="500" style="width:60px"></div>
    <button onclick="runCalc()">开始计算</button>
  </div>
</div>

<div class="box">
  <h3>2、主曲线：补偿趋势 + 波动区间（红线 ±0.002 工艺公差）</h3>
  <canvas id="chartMain"></canvas>
</div>

<div class="box">
  <h3>3、残差散点图（观察有无周期性/残留趋势，接刀缺陷诊断）</h3>
  <canvas id="chartResidual"></canvas>
</div>

<div class="box">
  <h3>4、计算结果输出【表格形式】</h3>
  <div id="resultOut"></div>
</div>

<script>
//========表格输入辅助函数========
function addRow(){
  const tb = document.querySelector("#inputTable tbody");
  const tr = document.createElement("tr");
  tr.innerHTML = `<td><input type="number" step="0.000001"></td><td><input type="number" step="0.000001"></td><td><button onclick="delRow(this)">删除</button></td>`;
  tb.appendChild(tr);
}
function delRow(btn){
  const tr = btn.parentElement.parentElement;
  const tb = tr.parentElement;
  if(tb.children.length>1) tr.remove();
  else alert("至少保留一行");
}
function clearTable(){
  const tb = document.querySelector("#inputTable tbody");
  tb.innerHTML = `<tr><td><input type="number" step="0.000001"></td><td><input type="number" step="0.000001"></td><td><button onclick="delRow(this)">删除</button></td></tr>`;
}
//读取输入表格，转为点数组
function readTablePoints(){
  const rows = document.querySelectorAll("#inputTable tbody tr");
  const pts = [];
  for(let r of rows){
    const inputs = r.querySelectorAll("input");
    const x = parseFloat(inputs[0].value);
    const y = parseFloat(inputs[1].value);
    if(!isNaN(x) && !isNaN(y)){
      pts.push({x,y});
    }
  }
  return pts;
}

// ========== 工具函数 ==========
// 最小二乘 一元线性拟合 y = k*x + b
function linearFit(points){
  const n = points.length;
  let sumX=0,sumY=0,sumXX=0,sumXY=0;
  for(let p of points){
    sumX += p.x;
    sumY += p.y;
    sumXX += p.x*p.x;
    sumXY += p.x*p.y;
  }
  const det = n*sumXX - sumX*sumX;
  if(Math.abs(det) < 1e-15){
    return {k:0, b: sumY/n};
  }
  const k = (n*sumXY - sumX*sumY)/det;
  const b = (sumY*sumXX - sumX*sumXY)/det;
  return {k,b};
}

// 多项式拟合
function polyFit(points, order){
  const n = points.length;
  const m = order+1;
  let matA = Array(m).fill(0).map(()=>Array(m).fill(0));
  let vecB = Array(m).fill(0);
  for(let p of points){
    let xpow = Array(m).fill(1);
    for(let i=1;i<m;i++) xpow[i] = xpow[i-1]*p.x;
    for(let i=0;i<m;i++){
      vecB[i] += p.y * xpow[i];
      for(let j=0;j<m;j++) matA[i][j] += xpow[i]*xpow[j];
    }
  }
  //高斯消元
  for(let col=0;col<m;col++){
    let pivot = col;
    for(let r=col;r<m;r++) if(Math.abs(matA[r][col])>Math.abs(matA[pivot][col])) pivot=r;
    [matA[col],matA[pivot]] = [matA[pivot],matA[col]];
    [vecB[col],vecB[pivot]] = [vecB[pivot],vecB[col]];
    const div = matA[col][col];
    if(Math.abs(div)<1e-12) continue;
    for(let j=col;j<m;j++) matA[col][j]/=div;
    vecB[col]/=div;
    for(let r=0;r<m;r++){
      if(r!==col && matA[r][col]!==0){
        const factor = matA[r][col];
        for(let j=col;j<m;j++) matA[r][j] -= factor*matA[col][j];
        vecB[r] -= factor*vecB[col];
      }
    }
  }
  return vecB;
}
function polyEval(coeff, x){
  let y=0;
  let xi=1;
  for(let c of coeff){
    y += c*xi;
    xi *=x;
  }
  return y;
}

//滑动窗口【对单个x求值，用于插值预测点】
function slidingEval(xTarget, rawPoints, winN){
  const half = Math.floor(winN/2);
  //找到离xTarget最近的下标
  let idx=0;
  for(let i=0; i<rawPoints.length;i++){
    if(rawPoints[i].x <= xTarget) idx=i;
  }
  let start = idx-half;
  let end = idx+half;
  if(start<0) start=0;
  if(end >= rawPoints.length) end = rawPoints.length-1;
  const winPts = rawPoints.slice(start, end+1);
  const lb = linearFit(winPts);
  const yTrend = lb.k * xTarget + lb.b;
  //窗口内计算局部sigma
  let sumE2 =0;
  for(let wp of winPts){
    const yp = lb.k*wp.x + lb.b;
    const e = wp.y - yp;
    sumE2 += e*e;
  }
  const sigmaLocal = Math.sqrt(sumE2 / winPts.length);
  return {
    yTrend:yTrend,
    sigmaLocal:sigmaLocal,
    band1:yTrend+sigmaLocal,
    band1Neg:yTrend-sigmaLocal,
    band196:yTrend+sigmaLocal*1.96,
    band196Neg:yTrend-sigmaLocal*1.96
  }
}

// 原始标定测点计算（用于残差）
function slidingCalcRawPoints(points, winN){
  const out = [];
  const half = Math.floor(winN/2);
  for(let i=0; i<points.length; i++){
    let start = i-half;
    let end = i+half;
    if(start<0) start=0;
    if(end >= points.length) end = points.length-1;
    const winPts = points.slice(start, end+1);
    const lb = linearFit(winPts);
    const yTrend = lb.k * points[i].x + lb.b;
    let sumE2 =0;
    for(let wp of winPts){
      const yp = lb.k*wp.x + lb.b;
      const e = wp.y - yp;
      sumE2 += e*e;
    }
    const sigmaLocal = Math.sqrt(sumE2 / winPts.length);
    const residual = points[i].y - yTrend;
    out.push({
      x: points[i].x,
      yMeas: points[i].y,
      yTrend: yTrend,
      residual: residual,
      sigmaLocal: sigmaLocal,
      band1: yTrend + sigmaLocal,
      band1Neg: yTrend - sigmaLocal,
      band196: yTrend + sigmaLocal*1.96,
      band196Neg: yTrend - sigmaLocal*1.96
    })
  }
  return out;
}

//生成插值预测点
function generateInterpolatePoints(rawPoints, count, winN, mode, polyOrder){
  const xs = rawPoints.map(p=>p.x);
  const xMin = Math.min(...xs);
  const xMax = Math.max(...xs);
  const interpOut = [];
  const step = (xMax-xMin)/(count-1);
  for(let k=0;k<count;k++){
    const x = xMin + k*step;
    if(mode==="sliding"){
      const res = slidingEval(x, rawPoints, winN);
      interpOut.push({x:x, ...res});
    }else{
      const coeff = polyFit(rawPoints, polyOrder);
      const yt = polyEval(coeff, x);
      //全局sigma
      let sumE2=0;
      for(let p of rawPoints){
        const ye = polyEval(coeff, p.x);
        sumE2 += Math.pow(p.y - ye, 2);
      }
      const sg = Math.sqrt(sumE2/rawPoints.length);
      interpOut.push({
        x:x,
        yTrend:yt,
        sigmaLocal:sg,
        band1:yt+sg,band1Neg:yt-sg,
        band196:yt+sg*1.96,band196Neg:yt-sg*1.96
      })
    }
  }
  return interpOut;
}

//全局多项式模式
function polyCalc(points, order){
  const coeff = polyFit(points, order);
  const allRes = [];
  let sumE2=0;
  let maxPos=-999, maxNeg=999;
  for(let p of points){
    const yt = polyEval(coeff, p.x);
    const e = p.y - yt;
    allRes.push(e);
    sumE2 += e*e;
    if(e>maxPos) maxPos=e;
    if(e<maxNeg) maxNeg=e;
  }
  const sigmaGlobal = Math.sqrt(sumE2/points.length);
  const out = [];
  for(let p of points){
    const yt = polyEval(coeff, p.x);
    out.push({
      x:p.x,
      yMeas:p.y,
      yTrend:yt,
      residual:p.y-yt,
      sigmaLocal: sigmaGlobal,
      band1: yt+sigmaGlobal,
      band1Neg: yt-sigmaGlobal,
      band196: yt+sigmaGlobal*1.96,
      band196Neg: yt-sigmaGlobal*1.96
    })
  }
  return {res:out, sigmaG:sigmaGlobal, maxPos, maxNeg, allRes};
}

//绘图实例
let chartMain, chartRes;
function drawMain(rawData, interpData){
  const ctx = document.getElementById("chartMain").getContext('2d');
  if(chartMain) chartMain.destroy();
  chartMain = new Chart(ctx,{
    type:"line",
    data:{
      datasets:[
        {label:"实测Y(标定测点)", data:rawData.map(d=>({x:d.x,y:d.yMeas})), borderColor:"#666",pointRadius:4,showLine:false},
        {label:"补偿趋势Ytrend【预测插值】", data:interpData.map(d=>({x:d.x,y:d.yTrend})), borderColor:"#2563eb", borderWidth:2,pointRadius:0},
        {label:"工艺波动上限 ±1σ", data:interpData.map(d=>({x:d.x,y:d.band1})), borderColor:"#10b981", borderWidth:1,pointRadius:0},
        {label:"工艺波动下限 ±1σ", data:interpData.map(d=>({x:d.x,y:d.band1Neg})), borderColor:"#10b981", borderWidth:1,pointRadius:0},
        {label:"局部置信上限 ±1.96σ", data:interpData.map(d=>({x:d.x,y:d.band196})), borderColor:"#f59e0b", borderWidth:1,pointRadius:0},
        {label:"局部置信下限 ±1.96σ", data:interpData.map(d=>({x:d.x,y:d.band196Neg})), borderColor:"#f59e0b", borderWidth:1,pointRadius:0},
        {label:"工艺公差 +0.002", data:interpData.map(d=>({x:d.x,y:0.002})), borderColor:"#ef4444", borderWidth:1,pointRadius:0,borderDash:[5,5]},
        {label:"工艺公差 -0.002", data:interpData.map(d=>({x:d.x,y:-0.002})), borderColor:"#ef4444", borderWidth:1,pointRadius:0,borderDash:[5,5]}
      ]
    },
    options:{responsive:true, scales:{x:{type:"linear",title:{text:"X",display:true}},y:{title:{text:"Y(mm)",display:true}}}}
  })
}
function drawResidual(data){
  const ctx = document.getElementById("chartResidual").getContext('2d');
  if(chartRes) chartRes.destroy();
  chartRes = new Chart(ctx,{
    type:"scatter",
    data:{
      datasets:[
        {label:"残差 e = Y实测-Y趋势", data:data.map(d=>({x:d.x,y:d.residual})), backgroundColor:"#7c3aed", pointRadius:4},
        {label:"0基准线", data:[{x:data[0].x,y:0},{x:data[data.length-1].x,y:0}], borderColor:"#333",showLine:true,pointRadius:0},
        {label:"公差±0.002", data:[{x:data[0].x,y:0.002},{x:data[data.length-1].x,y:0.002}], borderColor:"red", borderDash:[4,4],showLine:true,pointRadius:0},
        {label:"公差-0.002", data:[{x:data[0].x,y:-0.002},{x:data[data.length-1].x,y:-0.002}], borderColor:"red", borderDash:[4,4],showLine:true,pointRadius:0}
      ]
    },
    options:{responsive:true, scales:{x:{type:"linear",title:{text:"X"}},y:{title:{text:"残差(mm)"}}}}
  })
}

function runCalc(){
  const points = readTablePoints();
  if(points.length<3){
    alert("至少填写3组有效的X,Y数据！");
    return;
  }
  const mode = document.getElementById("calcMode").value;
  const interpTotal = parseInt(document.getElementById("interpCount").value);
  let rawResultData;
  let interpResultData;
  let maxPosRes=-999, maxNegRes=999;

  if(mode === "sliding"){
    const win = parseInt(document.getElementById("winSize").value);
    rawResultData = slidingCalcRawPoints(points, win);
    interpResultData = generateInterpolatePoints(points, interpTotal, win, "sliding");
  }else{
    const order = parseInt(document.getElementById("polyOrder").value);
    const polyRet = polyCalc(points, order);
    rawResultData = polyRet.res;
    interpResultData = generateInterpolatePoints(points, interpTotal, 0, "poly", order);
  }

  //遍历求残差极值
  for(let d of rawResultData){
    if(d.residual>maxPosRes) maxPosRes = d.residual;
    if(d.residual<maxNegRes) maxNegRes = d.residual;
  }

  //生成HTML结果表格
  let htmlTxt = `<p>最大正残差 = ${maxPosRes.toFixed(6)} mm<br>最大负残差 = ${maxNegRes.toFixed(6)} mm</p>`;
  htmlTxt += `<table>
  <thead>
    <tr>
      <th>X</th>
      <th>Y实测</th>
      <th>Y补偿趋势</th>
      <th>残差e</th>
      <th>局部σ_local</th>
      <th>工艺波动区间 ±1σ</th>
      <th>局部置信区间 ±1.96σ</th>
    </tr>
  </thead><tbody>`;
  for(let d of rawResultData){
    htmlTxt += `<tr>
    <td>${d.x.toFixed(6)}</td>
    <td>${d.yMeas.toFixed(6)}</td>
    <td>${d.yTrend.toFixed(6)}</td>
    <td>${d.residual.toFixed(6)}</td>
    <td>${d.sigmaLocal.toFixed(6)}</td>
    <td>±${d.sigmaLocal.toFixed(6)}</td>
    <td>±${(d.sigmaLocal*1.96).toFixed(6)}</td>
    </tr>`;
  }
  htmlTxt += `</tbody></table>`;
  document.getElementById("resultOut").innerHTML = htmlTxt;

  drawMain(rawResultData, interpResultData);
  drawResidual(rawResultData);
}
</script>
</body>
</html>
